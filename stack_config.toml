# Machine-readable build constraints for FantasyBasketball.
# This file is canonical for versions, dependencies, and gate minimums.
# Prose elsewhere that disagrees with this file is wrong.

[project]
name           = "FantasyBasketball"
solution       = "FantasyBasketball.sln"
root_namespace = "FantasyBasketball"
description    = "League-aware fantasy basketball decision engine"

[runtime]
# .NET 10 is the current LTS (released 2025-11).
sdk              = "10.0.100"
roll_forward     = "latestFeature"   # global.json; patch/feature drift is fine, major is not
target_framework = "net10.0"
lang_version     = "14.0"
nullable         = "enable"
implicit_usings  = "enable"
treat_warnings_as_errors = true

[database]
engine        = "postgresql"
version       = "17"
provisioning  = "docker-compose"     # compose.yaml at repo root
dev_container = "fb-postgres"
test_strategy = "testcontainers"     # integration tests get a throwaway container, never the dev DB

# --- Dependencies -----------------------------------------------------------
# Central Package Management: every version lives in Directory.Packages.props.
# packages.lock.json is committed for every project; restore runs --locked-mode.
# All versions below verified present on nuget.org 2026-07-29.

[dependencies.runtime]
"Microsoft.EntityFrameworkCore"             = "10.0.10"
"Microsoft.EntityFrameworkCore.Design"      = "10.0.10"
"Npgsql.EntityFrameworkCore.PostgreSQL"     = "10.0.3"
"Microsoft.Extensions.Http.Resilience"      = "10.8.0"   # retry + backoff + circuit breaker
"Microsoft.Extensions.Caching.Memory"       = "10.0.10"
"Microsoft.Extensions.Hosting"              = "10.0.10"
"AngleSharp"                                = "1.6.0"    # HTML parsing, CSS selectors

[dependencies.test]
"xunit.v3"                     = "3.2.2"
"xunit.runner.visualstudio"    = "3.1.5"
"Shouldly"                     = "4.3.0"
"Microsoft.NET.Test.Sdk"       = "18.8.1"
"Testcontainers.PostgreSql"    = "4.13.0"
"SSH.NET"                     = "2026.0.0" # Security override for Testcontainers' transitive dependency.
"coverlet.collector"           = "10.0.1"

[dependencies.epic]
# Added by the epic that needs them, NOT up front. Each is unused until its
# epic starts, and an unused pin is a dependency you are maintaining for free.
# All versions verified present on nuget.org 2026-07-29.
"CsvHelper"                                    = "33.1.0"   # E08 — CSV league/ADP import
"Microsoft.AspNetCore.Identity.EntityFrameworkCore" = "10.0.10"  # E11 — auth
"Anthropic"                                    = "12.39.0"  # E09 — official Anthropic SDK
"OpenTelemetry.Extensions.Hosting"             = "1.17.0"   # E12 — observability
"OpenTelemetry.Instrumentation.AspNetCore"     = "1.17.0"   # E12

[dependencies.framework_references]
# Provided by the SDK; never pinned as packages.
api = ["Microsoft.AspNetCore.App"]
# System.Threading.RateLimiting ships in the shared framework — do not add a package for it.

[dependencies.policy]
# Adding ANY package not listed above requires explicit user approval.
# Justify against this ladder, in order: does it need to exist at all; does the
# BCL do it; does the platform do it; does an already-listed package do it.
new_dependency_requires_approval = true

[forbidden.packages]
# Each entry is scannable: the gate greps Directory.Packages.props and *.csproj.
"FluentAssertions"   = "License changed to commercial from v8 (Xceed). Use Shouldly."
"Serilog*"           = "Built-in ILogger with structured message templates meets the requirement."
"MediatR"            = "License changed to commercial. Application services are called directly."
"AutoMapper"         = "License changed to commercial. Write the mapping; it is three lines."
"Newtonsoft.Json"    = "System.Text.Json is in the framework."
"HtmlAgilityPack"    = "AngleSharp is the chosen parser; one HTML parser only."
"Polly"              = "Consume it through Microsoft.Extensions.Http.Resilience, not directly."
"Hangfire"           = "BackgroundService covers every cadence this app has, including the box-score importer."
"StackExchange.Redis" = "IMemoryCache covers a single-instance self-hosted deployment."
"Moq"                = "Telemetry incident (SponsorLink). Hand-write fakes, or use NSubstitute with approval."
"MathNet.Numerics"   = "Only erf and rank correlation are needed; both are ~5 lines with a test. See contracts/category_value_contract.md"
"anthropic.sdk"      = "Community package. Use the official 'Anthropic' SDK instead."
"OpenAI"             = "The LLM boundary targets Claude only. See safety/llm_trust_boundary.md"

[forbidden.patterns]
# Regex-scanned across src/. Each pattern maps to the concept that explains why.
"DateTime\\.Now"             = "UTC only. Use DateTimeOffset.UtcNow / TimeProvider. See contracts/persistence_contract.md"
"DateTime\\.UtcNow"          = "Inject TimeProvider so time is testable. See contracts/persistence_contract.md"
"new HttpClient\\("          = "Use IHttpClientFactory. See components/ingestion_pipeline.md"
"\\.Result|\\.Wait\\(\\)"    = "Async all the way down; sync-over-async deadlocks. See components/application_services.md"
"catch\\s*\\(\\s*Exception\\s*\\w*\\s*\\)\\s*\\{\\s*\\}" = "Never silently swallow errors. See components/ingestion_pipeline.md"
"float |double "             = "Money-like and stat aggregate values use decimal. See contracts/stat_vocabulary.md"

[commands]
# The gate runs these in order. All must exit 0.
restore   = "dotnet restore --locked-mode"
format    = "dotnet format --verify-no-changes"
build     = "dotnet build --no-restore -c Release"
test      = "dotnet test --no-build -c Release --collect:\"XPlat Code Coverage\""
validate  = "python3 context/validate_okf.py"
compose_up = "docker compose up -d --wait"

[gates]
# Minimums. A gate that is not met blocks the commit, not the concept status.
domain_line_coverage_min      = 80     # FantasyBasketball.Domain
application_line_coverage_min = 70
build_warnings_allowed        = 0
okf_validator_errors_allowed  = 0
forbidden_pattern_hits_allowed = 0
accessibility_violations_allowed = 0   # E04 — WCAG 2.2 AA on every shipped page
tenant_isolation_failures_allowed = 0  # E11 — cross-user read/write is never acceptable

[llm]
# E09 only. The LLM proposes context events; it never makes a recommendation.
# Contract: contracts/llm_extraction_contract.md  Safety: safety/llm_trust_boundary.md
enabled_by_default = false             # self-hosters without a key get a fully working app
provider           = "anthropic"
model              = "claude-opus-5"   # configurable; effort is the cost lever, not the model
effort             = "medium"
max_output_tokens  = 8000
structured_output  = true              # schema-constrained; free-text output is rejected
tools_granted      = []                # the extractor gets no tools, ever
daily_token_budget = 200000            # hard stop; refuses rather than overspending
cache_system_prompt = true             # the catalog prompt is stable and >512 tokens

[distribution]
# E12. Self-hostable is the shipping target — see components/distribution_and_operations.md
artifact        = "container-image"
registry        = "ghcr.io"
platforms       = ["linux/amd64", "linux/arm64"]
quickstart      = "docker compose up"
ci              = "github-actions"
license         = "MIT"

[scraping]
# Canonical rate ceilings. safety/scraping_policy.md owns the path allowlist.
# These are deliberately far below the hosts' ban thresholds.
global_max_requests_per_minute = 6
default_delay_seconds          = 10
user_agent = "FantasyBasketballDecisionEngine/0.1 (personal project; contact via repository)"
respect_robots_txt             = true
cache_first                    = true

[data_sources]
# Which source fills which role. components/scrapers.md and the provider
# contracts own the implementation details.
identity_and_schedule = "balldontlie"           # HTTP JSON, free tier, API key required
season_stats          = "basketball-reference"  # HTML scraper, season-level pages only
adp                   = "fantasypros"           # HTML scraper, /nba/adp/ only, CSV fallback
news                  = "manual"                # MVP: user-entered context events only

[frontend]
# Owner-approved React migration; no CSS framework or component library.
node = "24"
react = "19.3.0"
react_dom = "19.3.0"
vite = "8.3.0"
typescript = "7.0.2"
types_react = "19.3.0"
types_react_dom = "19.3.0"
playwright = "1.58.2"
axe_playwright = "4.13.0"
